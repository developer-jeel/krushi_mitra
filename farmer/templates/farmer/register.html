{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Krushi Mitra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'farmer/css/login.css' %}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <div class="card">

    <div class="logo">
      <!-- You may need to replace this image path with your actual static image path -->
      <img src="{% static 'farmer/images/krushi_mitra_logo.png' %}" alt="Krushi Mitra Logo" onerror="this.style.display='none'" />
    </div>
    <p class="subtitle" data-translate="createANewAccount">Create a new account</p>

    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <p style="color: red; text-align: center; font-size: 14px;">{{ message }}</p>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST" action="{% url 'register' %}" id="registerForm">
      {% csrf_token %}
      
      <!-- Full Name -->
      <div class="form-group">
        <label for="name" data-translate="fullName">Full Name</label>
        <input data-translate="enterYourFullName" type="text" name="name" id="name" placeholder="Enter your full name" required />
      </div>

      <!-- Contact -->
      <div class="form-group">
        <label for="contact" data-translate="contactNumber">Contact Number</label>
        <input data-translate="10digitMobileNumber" type="tel" name="contact" id="contact" placeholder="10-digit mobile number" maxlength="10" required />
      </div>

      <!-- Role Selection -->
      <div class="form-group">
        <label class="field-label" data-translate="registerAs">Register As</label>
        <div class="radio-group">

          <input type="radio" name="role" id="roleFarmer" value="Farmer" class="radio-input" required onchange="toggleFields()" />
          <label for="roleFarmer" class="radio-card">
            <span class="role-icon">
              <!-- Farmer / Plant icon -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22V12"/>
                <path d="M12 12C12 7 7 4 3 6c0 5 4 8 9 6"/>
                <path d="M12 12c0-5 5-8 9-6 0 5-4 8-9 6"/>
              </svg>
            </span>
            <span class="role-name" data-translate="farmer">Farmer</span>
          </label>

          <input type="radio" name="role" id="roleBuyer" value="Buyer" class="radio-input" required onchange="toggleFields()" />
          <label for="roleBuyer" class="radio-card">
            <span class="role-icon">
              <!-- Buyer / Cart icon -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
              </svg>
            </span>
            <span class="role-name" data-translate="buyer">Buyer</span>
          </label>

        </div>
      </div>

      <!-- Aadhar Number (Required for Login) -->
      <div class="form-group" id="aadharGroup" style="display:none;">
        <label for="aadhar" data-translate="aadharCardNumber">Aadhar Card Number</label>
        <input data-translate="xxxxXxxxXxxx" type="text" name="aadhar" id="aadhar" placeholder="XXXX XXXX XXXX" maxlength="14" required />
      </div>

      <!-- Buyer: GST Number -->
      <div class="form-group" id="gstGroup" style="display:none;">
        <label for="gst" data-translate="gstNumber">GST Number</label>
        <input data-translate="eg22aaaaa0000a1z5" type="text" name="gst" id="gst" placeholder="e.g. 22AAAAA0000A1Z5" maxlength="15" />
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password" data-translate="password">Password</label>
        <input data-translate="createAPassword" type="password" name="password" id="password" placeholder="Create a password" required />
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPw" data-translate="confirmPassword">Confirm Password</label>
        <input data-translate="reenterYourPassword" type="password" name="confirmPw" id="confirmPw" placeholder="Re-enter your password" required />
      </div>

      <button type="submit" id="registerBtn" data-translate="createAccount">Create Account</button>

    </form>

    <p class="link">Already have an account? <a href="{% url 'login' %}" data-translate="loginHere">Login here</a></p>

  </div>

  <script>
    function toggleFields() {
      const isFarmer = document.getElementById('roleFarmer').checked;
      const isBuyer = document.getElementById('roleBuyer').checked;
      
      if (isFarmer || isBuyer) {
          document.getElementById('aadharGroup').style.display = 'block';
      }
      
      document.getElementById('gstGroup').style.display = isBuyer ? 'block' : 'none';
      if (isBuyer) {
          document.getElementById('gst').setAttribute('required', 'required');
      } else {
          document.getElementById('gst').removeAttribute('required');
      }
    }
  </script>

</body>

</html>
